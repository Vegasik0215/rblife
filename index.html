<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Симулятор жизни</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0e1014; --card:#181b22; --card2:#20242d; --line:#2a2f3a;
  --text:#eef1f6; --muted:#8b93a3; --accent:#f5c542; --accent-ink:#1a1400;
  --green:#3ecf6e; --red:#ff5d5d; --blue:#3d8bff;
  --c-common:#9aa3ad; --c-nice:#3ecf6e; --c-rare:#3d8bff; --c-epic:#b26bff; --c-legend:#f5c542;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;cursor:pointer}
img{display:block;max-width:100%}

/* шапка */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#14171d 0%,rgba(14,16,20,.96) 100%);
  backdrop-filter:blur(8px);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.money-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.label{font-size:12px;color:var(--muted)}
.money{font-size:26px;font-weight:800;letter-spacing:-.5px}
.money.neg{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border-radius:10px;padding:6px 8px}
.stat .v{display:flex;justify-content:space-between;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.stat .v span{overflow:hidden;text-overflow:ellipsis}
.stat .v b{color:var(--text)}
.bar{height:5px;background:#2a2f3a;border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.sub{margin-top:8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}

/* навигация */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);
  background:#12151b;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;
  color:var(--muted);font-size:11px;border-radius:10px}
.tabs button .e{font-size:22px;line-height:1;filter:grayscale(.6);opacity:.75}
.tabs button.on{color:var(--text)}
.tabs button.on .e{filter:none;opacity:1}

main{padding:14px 16px 20px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:14px;gap:2px;overflow-x:auto}
.seg button{flex:1;background:none;padding:8px 6px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--text)}

.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list .row{padding:10px 0;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:11px 12px;border-radius:12px;text-align:center}
.btn.sec{background:var(--card2);color:var(--text)}
.btn.red{background:#3a1d22;color:#ff8f8f}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--muted)}
.big-ic{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--card2);border-radius:12px;flex:none}
.item{display:flex;gap:12px;align-items:flex-start}
.item .body{flex:1;min-width:0}
.price{font-weight:800}
.plus{color:var(--green);font-weight:700}
.minus{color:var(--red);font-weight:700}
.lock{color:#ffb35c;font-size:12px;margin-top:4px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:44px;margin-bottom:8px}

.photo{border-radius:12px;width:100%;aspect-ratio:16/10;object-fit:cover;background:#22262f;margin-bottom:10px}
.stage{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2/1;margin:6px 0 12px;
  background:radial-gradient(ellipse at 50% 80%,#262b35 0%,#16191f 55%,#111317 100%)}
.stage img{position:relative;z-index:1;width:100%;height:100%}
.stage.cut img{object-fit:contain;padding:7% 3% 6%;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.stage.cut::after{content:"";position:absolute;left:14%;right:14%;bottom:9%;height:12%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.75) 0%,transparent 70%)}
.stage.photo img{object-fit:cover}
.car-title{text-align:center;font-size:22px;font-weight:800;margin:2px 0 8px}
.badges{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.cls{font-size:13px;font-weight:700;padding:5px 10px;border-radius:9px;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.tile{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.tile b{display:block;font-size:16px}
.tile span{font-size:12px;color:var(--muted)}
.menu{background:var(--card2);border-radius:14px;margin-top:12px;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;background:none;padding:13px 14px;text-align:left;
  border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu .ic{font-size:22px;width:28px;text-align:center}
.menu .t{flex:1}
.menu .r{color:var(--muted);display:flex;align-items:center;gap:6px}
.menu .r::after{content:"›";font-size:22px;line-height:1;color:#555c6a}
.menu .danger .t{color:#ff8f8f}
.car-plate{display:flex;justify-content:center;margin:-2px 0 8px}
.plate{width:100%;max-width:300px;border-radius:6px}
.plate.sm{max-width:150px}
.plate.xs{max-width:110px}
.tier{font-weight:800}
.t-common{color:var(--c-common)} .t-nice{color:var(--c-nice)} .t-rare{color:var(--c-rare)}
.t-epic{color:var(--c-epic)} .t-legend{color:var(--c-legend)}
.pcard{border-left:4px solid var(--c)}
.chances{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:10px 0 6px}
.chances i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

.progress{height:8px;background:#2a2f3a;border-radius:6px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#f5c542,#ff9f43)}
input.inp{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-size:16px}

/* рейтинг */
.top-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.top-row:last-child{border-bottom:0}
.top-row .n{width:28px;text-align:center;font-weight:800;font-size:16px}
.top-row.me{background:linear-gradient(90deg,rgba(245,197,66,.12),transparent);border-radius:10px}

/* тост */
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));z-index:30;
  background:#262b36;padding:12px 14px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  transform:translateY(-20px);opacity:0;transition:.25s;pointer-events:none;font-weight:600}
#toast.show{transform:none;opacity:1}
#toast.err{background:#3a1d22;color:#ffb3b3}

/* шторка */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s}
.sheet-body{position:relative;width:100%;max-height:88vh;overflow:auto;background:#15181e;border-radius:20px 20px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head b{font-size:18px}
.x{background:var(--card2);width:32px;height:32px;border-radius:50%}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* барабан лотереи */
.reel{position:relative;overflow:hidden;border-radius:14px;background:#0b0d11;padding:14px 0;margin:6px 0 14px}
.strip{display:flex;gap:8px;will-change:transform}
.ri{flex:none;width:132px;padding:12px 6px 10px;border-radius:10px;background:linear-gradient(0deg,color-mix(in srgb,var(--c) 30%,transparent),#1a1d24 70%);
  border-bottom:4px solid var(--c)}
.mp{background:#fafaf8;border:2px solid #111;border-radius:5px;color:#111;font:800 15px/28px system-ui,sans-serif;
  text-align:center;white-space:nowrap;letter-spacing:.3px}
.marker{position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:var(--accent);
  box-shadow:0 0 12px var(--accent);z-index:2}
.result{text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.result .plate{margin:4px auto 12px;max-width:320px}
.result.glow-legend .plate{box-shadow:0 0 0 3px var(--c-legend),0 0 40px var(--c-legend)}
.result.glow-epic .plate{box-shadow:0 0 0 3px var(--c-epic),0 0 30px var(--c-epic)}
.result h2{margin:0 0 4px;font-size:22px}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.report div{padding:9px 0;border-bottom:1px solid var(--line)}
.report div:last-child{border-bottom:0}
.pick{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);padding:10px;border-radius:12px;margin-bottom:8px;text-align:left}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}

/* ---- новое ---- */
.hbtn{position:relative;background:var(--card);width:44px;height:44px;border-radius:12px;font-size:22px;display:grid;place-items:center}
.hbtn .dotb{position:absolute;top:6px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);
  color:#fff;font-size:10px;font-weight:800;line-height:16px;text-align:center}
.hbtns{display:flex;gap:8px}
.seg{scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:14px}
.kv span{color:var(--muted)}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:16px;height:6px;border-radius:3px;background:#2f3542}
.lvl i.on{background:var(--accent)}
.spark{width:100%;height:42px;display:block;margin-top:6px}
.up{color:var(--green)} .down{color:var(--red)}
.reels{display:flex;justify-content:center;gap:10px;margin:8px 0 4px}
.reels div{width:72px;height:72px;border-radius:14px;background:#0b0d11;display:grid;place-items:center;font-size:40px;border:1px solid var(--line)}
.reels.spin div{animation:shake .12s infinite}
@keyframes shake{50%{transform:translateY(-4px)}}
.wheel{width:96px;height:96px;margin:6px auto;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;
  border:6px solid #2a2f3a;background:#0b0d11}
.wheel.red{border-color:#c8313e;color:#ff6b77}.wheel.black{border-color:#555;color:#ddd}.wheel.green{border-color:#2f9e5b;color:#6be39a}
.wheel.spin{animation:rot .4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.games{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.games button{flex:1 0 auto;background:var(--card);padding:9px 12px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.games button.on{background:var(--accent);color:var(--accent-ink)}
.bigx{font-size:46px;font-weight:900;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.bigx.boom{color:var(--red)}.bigx.ok{color:var(--green)}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.mgrid button{aspect-ratio:1;border-radius:10px;background:var(--card2);font-size:24px;border:1px solid var(--line)}
.mgrid button.gem{background:#173a25}.mgrid button.mine{background:#3a1d22}
.wheelbox{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.wheelbox div{padding:10px 0;border-radius:10px;background:var(--card2);text-align:center;font-weight:800;transition:.15s}
.wheelbox div.hl{background:var(--accent);color:var(--accent-ink);transform:scale(1.06)}
.jail{background:linear-gradient(135deg,#3a1d22,#181b22);outline:2px solid var(--red)}
.heat{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--green),var(--accent),var(--red));position:relative;margin:8px 0}
.heat i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:#fff;box-shadow:0 0 6px #000}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{width:46px;height:26px;border-radius:13px;background:#2f3542;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{left:23px}
.multi{display:grid;gap:8px}
.multi .mi.selable{cursor:pointer;position:relative}
.multi .mi .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.multi .mi.sel{outline:2px solid var(--red);background:#2a1a1f}
.multi .mi.sel .ck{background:var(--red);border-color:var(--red)}
.multi .mi.sold{opacity:.35;pointer-events:none}
.qty{display:flex;gap:6px;align-items:center;margin-top:10px}
.qty .inp{width:96px;flex:none;padding:8px 10px}
.multi .mi{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:8px;border-left:4px solid var(--c)}
.multi .mi .mp{flex:1;font-size:14px}
.chips button{background:var(--card2);padding:7px 10px;border-radius:9px;font-size:13px;font-weight:700}
.chips button.on{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:#3a2f12;color:var(--accent)}
.pill.g{background:#173a25;color:var(--green)} .pill.r{background:#3a1d22;color:#ff8f8f} .pill.b{background:#18284a;color:#7fb0ff}
.mini-car{width:110px;height:56px;object-fit:contain;flex:none;border-radius:8px;background:#111317}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.vs .side{flex:1}
.vs .side img{width:100%;height:70px;object-fit:contain}
.vs .side.win b{color:var(--green)}
.track{height:10px;background:#0b0d11;border-radius:6px;overflow:hidden;margin:6px 0}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width 2.5s cubic-bezier(.3,.1,.2,1)}
.rare-glow{box-shadow:0 0 0 2px var(--c-epic),0 0 30px rgba(178,107,255,.5)}
.legend-glow{box-shadow:0 0 0 2px var(--c-legend),0 0 40px rgba(245,197,66,.6)}
.logi{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.logi .muted{font-size:12px}
.flex1{flex:1;min-width:0}
.sp{height:8px}
textarea.inp,select.inp{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-size:16px}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="money-row">
    <div class="flex1"><div class="label" id="who">Деньги</div><div class="money" id="money">—</div></div>
    <div class="hbtns">
      <button class="hbtn" onclick="openDaily()" aria-label="Бонус">🎁<span class="dotb" id="dailyDot" hidden>!</span></button>
      <button class="hbtn" onclick="openLog()" aria-label="События">🔔<span class="dotb" id="logDot" hidden></span></button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="v"><span>⚡ Энергия</span><b id="sEn"></b></div><div class="bar"><i id="bEn" style="background:#f5c542"></i></div></div>
    <div class="stat"><div class="v"><span>❤️ Здоровье</span><b id="sHe"></b></div><div class="bar"><i id="bHe" style="background:#ff5d6c"></i></div></div>
    <div class="stat"><div class="v"><span>😊 Настрой</span><b id="sMo"></b></div><div class="bar"><i id="bMo" style="background:#3ecf6e"></i></div></div>
  </div>
  <div class="sub"><span id="day"></span><span id="worth"></span></div>
  <button class="btn" id="skipBtn" style="width:100%;margin-top:10px;padding:10px" onclick="skipDay()">⏭ Следующий день</button>
</header>

<main id="view"><div class="loading">Загрузка…</div></main>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="life" class="on"><span class="e">🏠</span>Жизнь</button>
  <button data-tab="money"><span class="e">💰</span>Финансы</button>
  <button data-tab="auto"><span class="e">🚗</span>Авто</button>
  <button data-tab="plates"><span class="e">🎰</span>Номера</button>
  <button data-tab="people"><span class="e">👥</span>Игроки</button>
</nav>

<div id="toast"></div>
<div id="sheet" class="sheet hidden">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet-body">
    <div class="sheet-head"><b id="sheetTitle"></b><button class="x" onclick="closeSheet()">✕</button></div>
    <div id="sheetContent"></div>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const tgv = v => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
try { tg.ready(); tg.expand(); } catch (e) {}
try { if (tgv('6.1')) { tg.setHeaderColor('#14171d'); tg.setBackgroundColor('#0e1014'); } } catch (e) {}
try { if (tgv('7.7')) tg.disableVerticalSwipes(); } catch (e) {}

let CFG = null, S = null;
const C = {};                       // кэш: top, market, social, auction, stocks, players
let tab = 'life';
const sub = { life: 'profile', money: 'biz', auto: 'salon', plates: 'cases', people: 'top' };
let game = 'roulette', caseCount = 1;
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let fastSpin = lsGet('rb_fast', '0') === '1';
function toggleFast() { fastSpin = !fastSpin; lsSet('rb_fast', fastSpin ? '1' : '0'); render(); }
const fastRow = () => `<div class="card toggle" onclick="toggleFast()"><div><b>⚡ Быстрая прокрутка</b><div class="small muted">Без долгой анимации барабана</div></div><div class="sw ${fastSpin ? 'on' : ''}"></div></div>`;
let sheetLocked = false;
const DEV_USER = new URLSearchParams(location.search).get('u');

// ---------- утилиты ----------
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/\s/g, ' ') + ' $';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tierColor = t => `var(--c-${t})`;
// номер РБ рисуем прямо на телефоне (canvas) — сервер для картинок не нужен
const PLATE_CACHE = {};
const STYLE_BG = { std: '#fafaf8', taxi: '#f7c91e', eco: '#78c878' };
const isRu = n => /^[А-Я]\d{3}[А-Я]{2} \d{2,3}$/.test(n);
const regionOf = n => isRu(n) ? (CFG.ru_regions[n.split(' ')[1]] || 'Россия') + ', ' + n.split(' ')[1] + ' регион' : CFG.regions[+n.slice(-1)];
function plateRu(num, style) {
  const W = 1040, H = 224, ox = 10, oy = 10, RW = 250;
  const c = document.createElement('canvas'); c.width = W + 20; c.height = H + 20;
  const x = c.getContext('2d');

function spark(hist, up) {
  if (!hist || hist.length < 2) return '';
  const min = Math.min(...hist), max = Math.max(...hist), w = 300, hh = 42;
  const pts = hist.map((v, i) => `${(i / (hist.length - 1) * w).toFixed(1)},${(hh - 4 - (v - min) / (max - min || 1) * (hh - 8)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><polyline fill="none" stroke="${up ? '#3ecf6e' : '#ff5d5d'}" stroke-width="2" points="${pts}"/></svg>`;
}

    const own = S.stocks[s.sym];

// барабан номеров
const LET = 'ABEIKMHOPCTX', rnd = n => Math.floor(Math.random() * n), rl = () => LET[rnd(12)];
function fakePlate(t) {
  const a = String(rnd(10)), b = String((+a + 1 + rnd(8)) % 10);
  let d, l = rl() + rl();
  if (t === 'common') d = String(rnd(9998) + 1).padStart(4, '0');
  else if (t === 'nice') d = [a + b + b + a, a + a + b + b, a + b + a + b][rnd(3)];
  else if (t === 'rare') d = [a + a + a + b, '00' + a + b, b + a + a + a][rnd(3)];
  else { d = rnd(2) ? String(1 + rnd(9)).repeat(4) : '000' + (1 + rnd(9)); if (t === 'legend') { const c = rl(); l = c + c; } }
  return `${d} ${l}-${1 + rnd(7)}`;
}
const RUL = 'АВЕКМНОРСТУХ', rul = () => RUL[rnd(12)];
function fakeRu(t) {
  const a = String(rnd(10)), b = String((+a + 1 + rnd(8)) % 10), regs = Object.keys(CFG.ru_regions), reg = regs[rnd(regs.length)];
  let d = String(rnd(998) + 1).padStart(3, '0'), L = rul() + rul() + rul();
  if (t === 'nice') d = a + a + b; else if (t === 'rare') d = a + b + a;
  else if (t === 'epic') d = a + a + a; else if (t === 'legend') { d = a + a + a; const c = rul(); L = c + c + c; }
  return `${L[0]}${d}${L.slice(1)} ${reg}`;
}
function rollTier(ch) { let x = Math.random() * 100; for (const [t, v] of Object.entries(ch)) { if ((x -= v) <= 0) return t; } return Object.keys(ch)[0]; }
async function quickSell(nums) { const r = await act('sell_plates', { nums }); if (r) closeSheet(); }
async function spin(caseId, free, count = 1) {
  const c = CFG.cases[caseId];
  count = free ? 1 : count;
  if (!free && S.money < c.price * count) { toast(`💸 Нужно ${fmt(c.price * count)}`, true); haptic('error'); return; }
  let res; try { res = await api('/api/action', { action: 'spin', case: caseId, free: !!free, count }); } catch (e) { return toast('Нет связи с сервером', true); }
  if (!res.ok) { toast(res.error, true); haptic('error'); return; }
  const list = res.spins || [res.spin], order = CFG.rarity_order;
  const best = list.reduce((a, b) => order.indexOf(b.tier) > order.indexOf(a.tier) ? b : a);
  const W = 132, GAP = 8, N = 46, WIN = 40, items = [];
  for (let i = 0; i < N; i++) { const t = i === WIN ? best.tier : rollTier(c.chances); items.push({ t, num: i === WIN ? best.num : (c.country === 'ru' ? fakeRu(t) : fakePlate(t)) }); }
  sheetLocked = true;
  openSheet(free ? '🎁 Бесплатный кейс' : c.name + (count > 1 ? ` ×${count}` : ''), `<div class="reel" id="reel"><div class="marker"></div><div class="strip" id="strip">
    ${items.map(x => `<div class="ri" style="--c:${tierColor(x.t)}"><div class="mp">${x.num}</div></div>`).join('')}</div></div>
    <div id="spinOut" class="muted small" style="text-align:center">Крутим барабан…</div>`);
  new Image().src = plateSrc(best.num);
  const strip = $('strip'), reel = $('reel'), D = fastSpin ? 600 : 5200;
  const target = WIN * (W + GAP) + W / 2 - reel.clientWidth / 2 + (Math.random() * 80 - 40);
  void strip.offsetWidth; strip.style.transition = `transform ${D}ms cubic-bezier(.08,.75,.12,1)`; strip.style.transform = `translateX(${-target}px)`;
  let ticks = 0; const tick = fastSpin ? 0 : setInterval(() => { if (++ticks < 18) haptic('light'); }, 140);
  setTimeout(() => {
    clearInterval(tick); sheetLocked = false; S = res.state; renderHeader(); render();
    const sp = best, r = CFG.rarity[sp.tier];
    const title = sp.tier === 'legend' ? '🔥 ДЖЕКПОТ! Блатной номер!' : sp.tier === 'epic' ? '💜 Эксклюзив!' : `${r.emoji} ${r.name} номер`;
    haptic(sp.tier === 'common' ? 'light' : 'success');
    const again = free ? '' : `<div class="btns"><button class="btn" onclick="spin('${caseId}',false,${count})">🎰 Ещё ${count > 1 ? '×' + count + ' ' : 'раз '}· ${fmt(c.price * count)}</button></div>`;
    if (list.length === 1) {
      $('spinOut').outerHTML = `<div class="result glow-${sp.tier}"><h2 class="t-${sp.tier}">${title}</h2>${plateImg(sp.num)}
        <div class="small muted">📍 ${regionOf(sp.num)}</div>${again}
        <div class="btns"><button class="btn red" onclick="quickSell(['${sp.num}'])">💵 Продать · ${fmt(sp.value)}</button><button class="btn sec" onclick="closeSheet();plateToCar('${sp.num}')">🚗 На машину</button></div>
        <div class="btns"><button class="btn ghost" onclick="closeSheet()">Забрать в коллекцию</button></div></div>`;
      return;
    }
    const items2 = list.slice().sort((a, b) => order.indexOf(b.tier) - order.indexOf(a.tier)).map(x => ({ k: x.num.replace(/\W/g, '_'), ref: x.num, value: x.value, color: tierColor(x.tier),
      html: `<div class="mp">${x.num}</div><span class="small t-${x.tier}">${CFG.rarity[x.tier].emoji}</span>` }));
    $('spinOut').outerHTML = `<div class="result"><h2 class="t-${sp.tier}">${title}</h2>${selList('plates', items2)}${again}
      <div class="btns"><button class="btn ghost" onclick="closeSheet()">Забрать в коллекцию</button></div></div>`;
  }, D + 200);
}
let aucTimer = null;
function vAuction() {
  const a = C.auction;
  clearInterval(aucTimer);
  if (!a) return `<div class="loading">Загрузка аукциона…</div>`;
  if (!a.open) return `<div class="card empty"><div class="e">🔨</div>Аукцион проходит каждый день в <b style="color:var(--text)">${a.next_hour}:00</b> и длится час.<br>
    На торги выставляется один «Эксклюзив» или «Блатной» номер.${a.last ? `<div class="small" style="margin-top:12px">Прошлый лот: <b>${a.last.num}</b> — ${a.last.bidder ? 'продан за ' + fmt(a.last.bid) : 'без ставок'}</div>` : ''}</div>`;
  aucTimer = setInterval(() => { const el = $('aleft'); if (!el) return clearInterval(aucTimer); a.left = Math.max(0, a.left - 1); el.textContent = mmss(a.left); if (!a.left) { clearInterval(aucTimer); load('auction', '/api/auction'); } }, 1000);
  const mine = a.bidder && S && a.bidder_name && C.top && false;
  return `<div class="card" style="text-align:center"><div class="small muted">Лот дня · ${CFG.rarity[a.tier].emoji} ${CFG.rarity[a.tier].name}</div>
    <div style="margin:10px auto;max-width:320px" class="result glow-${a.tier}">${plateImg(a.num)}</div>
    <div class="small muted">До конца: <b id="aleft" style="color:var(--text)">${mmss(a.left)}</b> · ставка в последние 2 мин продлевает торги</div>
    <div class="tiles" style="margin-top:10px"><div class="tile"><b>${fmt(a.bid)}</b><span>${a.bidder ? 'текущая ставка' : 'стартовая цена'}</span></div>
      <div class="tile"><b>${esc(a.bidder_name || '—')}</b><span>лидер</span></div><div class="tile"><b>${fmt(a.value)}</b><span>выкуп банком</span></div></div>
    <input class="inp" id="bidv" type="number" inputmode="numeric" value="${a.min_bid}" style="margin-top:12px">
    <div class="btns"><button class="btn" onclick="placeBid()">🔨 Сделать ставку</button></div>
    <div class="small muted" style="margin-top:8px">Минимум ${fmt(a.min_bid)}. Деньги замораживаются; если тебя перебьют — вернутся.</div></div>`;
}
async function placeBid() { const v = num('bidv'); if (!v) return toast('Введи сумму', true); const r = await act('bid', { amount: v }); if (r) load('auction', '/api/auction'); }

// ================= ИГРОКИ =================
function vPeople() {
  const inc = C.social ? C.social.offers.filter(o => o.incoming).length + C.social.races.filter(r => r.incoming && r.status === 'pending').length : 0;
  let h = seg('people', [['top', '🏆 Топ'], ['market', '🛒 Рынок'], ['offers', `🔄 Предложения${inc ? ` (${inc})` : ''}`]]);
  return h + ({ top: vTop, market: vMarket, offers: vOffers })[sub.people]();
}
function vTop() {
  const d = C.top; if (!d) return `<div class="loading">Загрузка рейтинга…</div>`;
  const medal = i => ['🥇', '🥈', '🥉'][i] || (i + 1);
  return `<div class="card"><h3>🏆 Самые богатые</h3><div class="small muted">Нажми на игрока — откроется его профиль</div>` + d.top.map((x, i) => `
    <div class="top-row ${x.me ? 'me' : ''}" onclick="${x.me ? '' : `openProfile(${x.id})`}"><div class="n">${medal(i)}</div>
      <div class="flex1"><b>${esc(x.name)}${x.me ? ' (ты)' : ''}</b>${x.lux ? ` <span>${x.lux}</span>` : ''}<div class="small muted">${fmt(x.worth)} · день ${x.day}${x.car ? ' · 🚗 ' + esc(x.car) : ''}</div></div>
      <div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:3px">${x.model ? `<img src="${carSrc(x.model)}" style="width:76px;height:34px;object-fit:contain" alt="">` : ''}
      ${x.plate ? `<img class="plate xs" src="${plateSrc(x.plate, x.plate_style)}" alt="">` : ''}</div></div>`).join('') +
    (d.my_place > 30 ? `<div class="small muted" style="margin-top:10px">Твоё место: ${d.my_place} из ${d.total}</div>` : '') + `</div>`;
}
async function openProfile(id) {
  let p; try { p = await api('/api/profile/' + id); } catch (e) { return toast('Нет связи', true); }
  if (p.error) return toast(p.error, true);
  window._prof = p;
  openSheet(`👤 ${esc(p.name)}`, `<div class="kv"><span>Капитал</span><b>${fmt(p.worth)}</b><span>Город</span><b>${CFG.cities[p.city].name}</b>
      <span>Образование</span><b>${CFG.edu_names[p.edu]}</b><span>Бизнесов / объектов</span><b>${p.biz} / ${p.prop}</b>
      <span>Гонки</span><b>🏆 ${p.stats.races_won || 0} · 💨 ${p.stats.races_lost || 0}</b><span>Серия бонусов</span><b>${p.streak} дн.</b></div>
    ${p.lux ? `<div style="margin-top:8px;font-size:22px">${p.lux}</div>` : ''}
    ${p.sets.length ? `<div style="margin-top:10px">${p.sets.map(s => `<span class="pill g" style="margin-right:4px">${CFG.sets[s].icon} ${CFG.sets[s].name}</span>`).join('')}</div>` : ''}
    <div class="btns"><button class="btn" onclick="sendMoney(${id})">💸 Перевести</button><button class="btn sec" onclick="raceSetup(${id},'${esc(p.name).replace(/'/g, '')}')">🏁 Гонка</button></div>
    <div class="btns"><button class="btn sec" onclick="giftPlate(null,${id})">🎁 Подарить номер</button><button class="btn sec" onclick="swapSetup(${id})">🔄 Обмен</button></div>
    <h3 style="margin-top:16px">🅿️ Гараж</h3>${p.cars.length ? p.cars.map(c => `<div class="card" style="background:var(--card2)"><b>${esc(CFG.cars[c.model].name)}</b> <span class="muted small">${c.hp} л.с.</span>
      ${carStage(c.model)}${c.plate ? `<div class="car-plate">${plateImg(c.plate, 'sm', c.plate_style)}</div>` : ''}</div>`).join('') : '<div class="small muted">Пусто</div>'}
    <h3 style="margin-top:16px">🔢 Номера</h3>${p.plates.length ? p.plates.slice(0, 12).map(x => `<div style="margin-bottom:8px">${plateImg(x.num, 'sm', x.style)}</div>`).join('') : '<div class="small muted">Нет</div>'}`);
}
function sendMoney(id) {
  openSheet('💸 Перевод', `<input class="inp" id="smv" type="number" inputmode="numeric" placeholder="Сумма, $">
    <div class="btns"><button class="btn" onclick="doSend(${id})">Перевести</button></div><div class="small muted" style="margin-top:8px">Без комиссии. Отменить нельзя.</div>`);
}
async function doSend(id) { const v = num('smv'); if (!v) return toast('Введи сумму', true); if (await ask(`Перевести ${fmt(v)}?`)) { const r = await act('send', { to: id, amount: v }); if (r) closeSheet(); } }
async function giftPlate(numv, to) {
  if (!S.plates.length) return toast('У тебя нет номеров', true);
  if (numv && !to) {   // выбрали номер — выбираем игрока
    const players = await api('/api/players');
    return openSheet(`🎁 Кому подарить ${numv}?`, players.filter(p => !p.me).map(p => `<button class="pick" onclick="doGift('${numv}',${p.id},'${esc(p.name).replace(/'/g, '')}')"><div class="big-ic">👤</div><div><b>${esc(p.name)}</b><div class="small muted">${fmt(p.worth)}</div></div></button>`).join('') || '<div class="empty">Других игроков пока нет</div>');
  }
  openSheet('🎁 Какой номер подарить?', S.plates.map(p => `<button class="pick" onclick="doGift('${p.num}',${to},'')">${plateImg(p.num, 'sm', p.style)}<div class="tier t-${p.tier}">${CFG.rarity[p.tier].name}</div></button>`).join(''));
}
async function doGift(n, to, name) { if (await ask(`Подарить номер ${n}${name ? ' игроку ' + name : ''}? Это навсегда.`)) { const r = await act('gift', { to, num: n }); if (r) closeSheet(); } }
function swapSetup(id) {
  const p = window._prof;
  if (!S.plates.length) return toast('У тебя нет номеров для обмена', true);
  if (!p.plates.length) return toast('У игрока нет номеров', true);
  window._give = null; window._get = null;
  const pick = (arr, key) => arr.map(x => `<button class="pick" data-k="${key}" onclick="document.querySelectorAll('[data-k=${key}]').forEach(b=>b.style.outline='');this.style.outline='2px solid var(--accent)';window._${key}='${x.num}'">${plateImg(x.num, 'sm', x.style)}<div class="tier t-${x.tier}">${CFG.rarity[x.tier].name}</div></button>`).join('');
  openSheet('🔄 Обмен номерами', `<b>Отдаёшь</b>${pick(S.plates, 'give')}<b>Получаешь</b>${pick(p.plates, 'get')}
    <div class="btns"><button class="btn" onclick="doSwap(${id})">Предложить обмен</button></div><div class="small muted" style="margin-top:8px">Игрок получит уведомление и сможет принять или отказаться (24 часа).</div>`);
}
async function doSwap(id) { if (!window._give || !window._get) return toast('Выбери оба номера', true); const r = await act('swap', { to: id, give: window._give, get: window._get }); if (r) closeSheet(); }

function vMarket() {
  const d = C.market; if (!d) return `<div class="loading">Загрузка рынка…</div>`;
  let h = `<div class="card small muted">Покупай и продавай машины и номера другим игрокам. Комиссия продавца 5 %. Выставить можно в гараже или в «Моих номерах».</div>`;
  if (!d.length) return h + `<div class="card empty"><div class="e">🛒</div>Пока пусто — выставь что-нибудь первым!</div>`;
  return h + d.map(x => `<div class="card">${x.kind === 'car' ? `<div class="row"><b>${esc(CFG.cars[x.model].name)}</b><span class="muted small">${x.hp} л.с.</span></div>${carStage(x.model)}`
    : `<div style="max-width:300px">${plateImg(x.num, '', x.style)}</div><div class="tier t-${x.tier}" style="margin-top:6px">${CFG.rarity[x.tier].emoji} ${CFG.rarity[x.tier].name}</div>`}
    <div class="row" style="margin-top:8px"><span class="small muted">Продавец: ${esc(x.seller_name)}</span><b class="price">${fmt(x.price)}</b></div>
    <div class="btns">${x.mine ? `<button class="btn sec" onclick="lotCancel(${x.id})">Снять с продажи</button>` : `<button class="btn ${S.money < x.price ? 'sec' : ''}" onclick="lotBuy(${x.id},${x.price})">Купить</button>`}</div></div>`).join('');
}
function sellLot(kind, ref) {
  const title = kind === 'car' ? CFG.cars[S.cars.find(c => c.id === ref).model].name : `номер ${ref}`;
  openSheet(`🏷 На рынок: ${title}`, `<input class="inp" id="lotp" type="number" inputmode="numeric" placeholder="Цена, $">
    <div class="small muted" style="margin-top:8px">Тебе придёт цена минус 5 %. ${kind === 'car' ? 'Номер с машины останется у тебя.' : 'Номер снимется с машины.'}</div>
    <div class="btns"><button class="btn" onclick="doLot('${kind}','${ref}')">Выставить</button></div>`);
}
async function doLot(kind, ref) { const v = num('lotp'); if (!v) return toast('Введи цену', true); const r = await act('sell_lot', { kind, ref: kind === 'car' ? +ref : ref, price: v }); if (r) { closeSheet(); goto('people', 'market'); } }
async function lotBuy(id, price) { if (await ask(`Купить за ${fmt(price)}?`)) { const r = await act('buy_lot', { id }); if (r) load('market', '/api/market'); } }
async function lotCancel(id) { const r = await act('cancel_lot', { id }); if (r) load('market', '/api/market'); }

function vOffers() {
  const d = C.social; if (!d) return `<div class="loading">Загрузка…</div>`;
  const races = d.races.filter(r => r.status === 'pending');
  let h = '';
  if (races.length) h += `<div class="card"><div class="row"><h3>🏁 Вызовы на гонку</h3><button class="btn sec" style="flex:none" onclick="goto('auto','races')">Открыть</button></div><div class="small muted">${races.length} активн.</div></div>`;
  if (!d.offers.length) return h + `<div class="card empty"><div class="e">🔄</div>Предложений обмена нет.<br>Открой профиль игрока в топе, чтобы предложить обмен.</div>`;
  return h + d.offers.map(o => `<div class="card"><div class="small muted">${o.incoming ? `${esc(o.from_name)} предлагает` : `Ты предлагаешь ${esc(o.to_name)}`}</div>
    <div class="row" style="margin-top:8px;align-items:center"><div class="flex1">${plateImg(o.give, 'sm')}<div class="small muted">${o.incoming ? 'получишь' : 'отдаёшь'}</div></div><b>⇄</b>
      <div class="flex1">${plateImg(o.get, 'sm')}<div class="small muted">${o.incoming ? 'отдашь' : 'получишь'}</div></div></div>
    <div class="btns">${o.incoming ? `<button class="btn" onclick="swapAns(${o.id},true)">Принять</button><button class="btn sec" onclick="swapAns(${o.id},false)">Отклонить</button>`
      : `<button class="btn sec" onclick="swapAns(${o.id},false)">Отменить</button>`}</div></div>`).join('');
}
async function swapAns(id, accept) { const r = await act('swap_answer', { id, accept }); if (r) load('social', '/api/social'); }

// ================= ШТОРКА =================
function openSheet(title, html) { $('sheetTitle').textContent = title; $('sheetContent').innerHTML = html; $('sheet').classList.remove('hidden'); }
function closeSheet() { if (sheetLocked) return; $('sheet').classList.add('hidden'); }

// ================= СТАРТ =================
async function start() {
  if (!inTG && !tokGet() && !DEV_USER) return showLogin();
  $('view').innerHTML = '<div class="loading">Загрузка…</div>';
  try { [CFG, S] = await Promise.all([api('/api/config'), api('/api/state').then(r => r.state)]); }
  catch (e) { if (e.message !== 'auth') $('view').innerHTML = `<div class="card empty"><div class="e">📡</div>Нет связи с сервером.<div class="btns"><button class="btn" onclick="start()">Повторить</button></div></div>`; return; }
  $('top').hidden = false; $('tabs').hidden = false;
  renderHeader(); render();
  load('social', '/api/social');
  if (S.daily_available) setTimeout(openDaily, 600);
}
start();
</script>
</body>
</html>
